[package]
name = "zerodb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"

# The fuzz crate is intentionally NOT a member of the root workspace: cargo-fuzz
# builds it with nightly + sanitizer flags that must not perturb the workspace.
# An empty `[workspace]` table makes this its own workspace root.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zerodb-oracle = { path = "../crates/zerodb-oracle" }
# zerodb-core carries no C linkage; the fuzz crate is its own workspace, so this
# is safe to add for the page-decode target (M1.1).
zerodb-core = { path = "../crates/zerodb-core" }

[[bin]]
name = "diff_ops"
path = "fuzz_targets/diff_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_page_decode"
path = "fuzz_targets/fuzz_page_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_image_open"
path = "fuzz_targets/fuzz_image_open.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
