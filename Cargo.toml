[package]
name = "zerodb"
version = "0.1.0"
edition = "2024"
description = "A pure-Rust port of LMDB"
license = "MIT"
repository = "https://github.com/quentindequelen/zerodb"

[features]
default = []
serde = ["dep:serde", "dep:serde_json", "dep:bincode"]

[dependencies]
# Memory mapping
memmap2 = "0.9"

# Bitflags for page/env/db flags
bitflags = "2.6"

# Cross-platform file locking
fs2 = "0.4"

# Page size detection
page_size = "0.6"

# Error handling
thiserror = "2.0"

# Byte ordering for endian-aware types (Heed compatibility)
byteorder = "1.5"

# Serde support (optional, for SerdeJson/SerdeBincode types)
serde = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
bincode = { version = "1.3", optional = true }

# Platform-specific syscalls (madvise, F_FULLFSYNC)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
criterion = "0.5"
heed = "0.20"
rocksdb = "0.22"

[[bench]]
name = "basic_ops"
harness = false

[[bench]]
name = "comparison"
harness = false

# Enable debug symbols in release for profiling
[profile.release]
debug = true
