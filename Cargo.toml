[workspace]
resolver = "2"
members = [
  "crates/zerodb-core",
  "crates/zerodb-io",
  "crates/zerodb",
  "crates/heed-zerodb",
  "crates/zerodb-tools",
  "crates/zerodb-oracle",
]

[workspace.package]
edition = "2021"
# 1.98: the toolchain Meilisearch pins (its rust-toolchain.toml, 1.98.1), the
# primary consumer — no point promising older. Verified by the `msrv` CI job.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qdequele/ZeroDB"
authors = ["Quentin de Quelen <quentin@meilisearch.com>"]

[workspace.dependencies]
memmap2 = "0.9"
libc = "0.2"
thiserror = "2"
proptest = "1"
arbitrary = { version = "1", features = ["derive"] }
criterion = "0.8"
