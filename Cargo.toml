[workspace]
resolver = "2"
members = [
  "crates/zerodb-core",
  "crates/zerodb-io",
  "crates/zerodb",
  "crates/heed-zerodb",
  "crates/zerodb-tools",
  "crates/zerodb-oracle",
]
# `crates/heed-shim` is a standalone crate literally named `heed` (v0.22.1) that
# re-exports `heed-zerodb`; it is the target of the consumer `[patch.crates-io]`
# (milestone 1.13). Excluded so its `heed` name never collides with the oracle's
# real crates.io `heed` (real LMDB) inside this workspace.
exclude = ["crates/heed-shim"]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qdequele/ZeroDB"

[workspace.dependencies]
memmap2 = "0.9"
libc = "0.2"
thiserror = "1"
crossbeam-utils = "0.8"
proptest = "1"
arbitrary = { version = "1", features = ["derive"] }
criterion = "0.5"
