# Release: on a `v*` tag, run the gate, build `zerodb-tools` for the three
# supported targets, publish a GitHub release whose notes are the matching
# CHANGELOG.md section, then publish the four engine crates to crates.io
# (ADR-0013 Option B). The heed drop-in path is the git `[patch]` on
# `crates/heed-shim` and is not published (the `heed` name is taken).
#
# Process: docs/RELEASING.md.

name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; only the `release` job gets write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version' crates/zerodb/Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          [ "$tag" = "$ver" ] || { echo "tag v$tag != crates/zerodb version $ver"; exit 1; }
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "CHANGELOG.md has no ## [$tag] section"; exit 1; }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  tools:
    name: zerodb-tools (${{ matrix.target }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Default features only: `migrate-from-lmdb` links C LMDB and is a
      # from-source feature (docs/TOOLS.md).
      - run: cargo build --release -p zerodb-tools --target ${{ matrix.target }}
      - name: package
        run: |
          name="zerodb-tools-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/zerodb-tools" "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE docs/TOOLS.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zerodb-tools-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: tools
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v tag="$tag" '
            /^## \[/ { if (found) exit; if ($0 ~ "^## \\[" tag "\\]") { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "empty notes for $tag"; exit 1; }
          cat notes.md
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ZeroDB $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist/*.tar.gz dist/*.sha256

  # Last on purpose: if crates.io rejects the upload the tag and the GitHub
  # release stand, and a maintainer re-runs `cargo publish --workspace` from the
  # tag (docs/RELEASING.md). `--workspace` publishes the four engine crates in
  # dependency order and skips the `publish = false` members (heed-zerodb,
  # zerodb-oracle). The token is a crates.io token scoped to publish-new /
  # publish-update on these crates, stored as the CARGO_REGISTRY_TOKEN secret.
  publish:
    name: crates.io publish
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
