# ZeroDB CI — the CONTRIBUTING.md check battery, automated.
#
# Per push / PR: fmt, clippy, tests (x86-64 and aarch64), an MSRV check, miri
# on the core, the I/O layer and the heed adapter, loom on the reader table
# and the writer locks, the free-list save without pool draws, the fuzz gate
# and the crash smoke.
# Nightly: the long fuzz, the full crash run, the reader stress, and the
# engine's tests under ThreadSanitizer and AddressSanitizer.
# The miri, loom, fuzz, crash, stress and sanitizer jobs run the justfile
# recipes of the same name, so `just <recipe>` locally runs exactly what CI
# runs.
# The oracle crate links the real LMDB fork (lmdb-master-sys), so every job
# needs a C toolchain — the GitHub Ubuntu images ship gcc.
#
# Still missing from the testing strategy: a 64K-page kernel. GitHub's
# hosted aarch64 runners use 4K pages; a self-hosted Graviton box with a 64K
# kernel (e.g. RHEL for ARM) has to be added by hand under `runs-on`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly, 02:00 UTC
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: fmt + clippy + test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The API of Meilisearch's heed fork (ADR-0027): not additive, so it is
      # built and tested on its own, never with the rest of the workspace.
      - run: cargo clippy -p heed --all-targets --features unique-txns -- -D warnings
      - run: cargo test -p heed --features unique-txns
      # The four engine crates must stay publishable (ADR-0013 rule 10): manifest
      # metadata, versioned internal deps, readme paths. No upload, no build.
      - run: cargo publish --workspace --dry-run --no-verify

  msrv:
    name: MSRV (workspace rust-version)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read rust-version
        id: msrv
        run: echo "v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The MSRV promise covers the crates a consumer builds, without
      # dev-dependencies (those only matter for running our own benches and
      # tests, which track current stable).
      - run: cargo check -p zerodb-core -p zerodb-io -p zerodb -p heed -p zerodb-tools
      - run: cargo check -p heed --features unique-txns

  miri:
    name: miri (zerodb-core, zerodb-io, heed)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install just --version 1.58.0 --locked
      - run: cargo miri setup
      - run: just miri

  loom:
    name: loom (reader table, writer locks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install just --version 1.58.0 --locked
      - run: just loom

  save-no-draw:
    name: free-list save without pool draws
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install just --version 1.58.0 --locked
      - run: just save-no-draw

  fuzz-quick:
    name: fuzz gate (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo install just --version 1.58.0 --locked
      - run: just fuzz-quick
      - name: keep any crash artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.os }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  crash-quick:
    name: crash-consistency smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install just --version 1.58.0 --locked
      - run: just crash-test-quick

  nightly:
    name: nightly — long fuzz, full crash run, stress (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350 # GitHub caps a job at 6 h
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo install just --version 1.58.0 --locked
      - run: just stress
      - run: just crash-test-full
      # 3.5 h native + 26 min through the heed adapter, to fit the 6 h job
      # cap; the 24 h soak the consumer integration gate asks for needs a
      # self-hosted runner.
      - run: just fuzz-long 12600
      - name: keep any crash artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-fuzz-artifacts-${{ matrix.os }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  # The tests miri cannot run (real files, mmap, fcntl, the futex, other
  # processes) under the sanitizers, each in its own job so neither eats the
  # long nightly job's time. `-Zbuild-std` instruments the standard library
  # too, which ThreadSanitizer needs to see std's own synchronization. The
  # oracle is left out: it links C LMDB, which is not instrumented.
  sanitizers:
    name: nightly — ${{ matrix.sanitizer }} sanitizer (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        sanitizer: [thread, address]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sanitizer-${{ matrix.sanitizer }}
      - run: cargo install just --version 1.58.0 --locked
      - run: just sanitize ${{ matrix.sanitizer }}
