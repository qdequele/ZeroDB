# ZeroDB CI — the CONTRIBUTING.md check battery, automated.
#
# Per push / PR: fmt, clippy, tests (x86-64 and aarch64), an MSRV check, miri
# on the core, loom on the reader table, the free-list save without pool
# draws, the fuzz gate and the crash smoke.
# Nightly: the long fuzz, the full crash run, the reader stress, the
# power-loss run on ext4 and XFS (also on pull requests that touch it), and
# the consumer gate (Meilisearch's milli and index-scheduler suites and
# hannoy's suite on ZeroDB, through scripts/consumer.sh and scripts/hannoy.sh).
# The loom, fuzz, crash and stress jobs run the justfile recipes of the same
# name, so `just <recipe>` locally runs exactly what CI runs.
# The oracle crate links the real LMDB fork (lmdb-master-sys), so every job
# needs a C toolchain — the GitHub Ubuntu images ship gcc.
#
# Still missing from the testing strategy: a 64K-page kernel. GitHub's
# hosted aarch64 runners use 4K pages; a self-hosted Graviton box with a 64K
# kernel (e.g. RHEL for ARM) has to be added by hand under `runs-on`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly, 02:00 UTC
  workflow_dispatch:
    inputs:
      meilisearch_ref:
        description: "Meilisearch ref for the consumer gate (empty: the pinned release)"
        required: false
        default: ""
      hannoy_ref:
        description: "hannoy ref for the consumer gate (empty: the pinned tag)"
        required: false
        default: ""

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: fmt + clippy + test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The API of Meilisearch's heed fork (ADR-0027): not additive, so it is
      # built and tested on its own, never with the rest of the workspace.
      - run: cargo clippy -p heed --all-targets --features unique-txns -- -D warnings
      - run: cargo test -p heed --features unique-txns
      # The four engine crates must stay publishable (ADR-0013 rule 10): manifest
      # metadata, versioned internal deps, readme paths. No upload, no build.
      - run: cargo publish --workspace --dry-run --no-verify

  msrv:
    name: MSRV (workspace rust-version)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read rust-version
        id: msrv
        run: echo "v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The MSRV promise covers the crates a consumer builds, without
      # dev-dependencies (those only matter for running our own benches and
      # tests, which track current stable).
      - run: cargo check -p zerodb-core -p zerodb-io -p zerodb -p heed -p zerodb-tools
      - run: cargo check -p heed --features unique-txns

  miri:
    name: miri (zerodb-core)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo miri setup
      - run: cargo miri test -p zerodb-core

  loom:
    name: loom (reader table)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install just --version 1.58.0 --locked
      - run: just loom

  save-no-draw:
    name: free-list save without pool draws
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install just --version 1.58.0 --locked
      - run: just save-no-draw

  fuzz-quick:
    name: fuzz gate (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo install just --version 1.58.0 --locked
      - run: just fuzz-quick
      - name: keep any crash artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.os }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  crash-quick:
    name: crash-consistency smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install just --version 1.58.0 --locked
      - run: just crash-test-quick

  # Power loss below the file system (docs/maintainers/POWER-LOSS.md): the
  # workload runs on ext4 and XFS over a dm-log-writes device, and every cut
  # point is rebuilt, mounted and verified. Needs root, loop devices and the
  # dm-log-writes target, which the hosted runners provide through sudo and
  # linux-modules-extra. Nightly on both architectures; on a pull request only
  # when the harness or the I/O crate changed, in a shorter form.
  power-loss:
    name: power loss, dm-log-writes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - name: decide whether this pull request needs the run
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_ARCH" != X64 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD |
            grep -qE '^(scripts/power-loss/|crates/zerodb-oracle/src/crash/powerloss|crates/zerodb-oracle/src/bin/power-loss|crates/zerodb-io/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: install xfsprogs and the device-mapper modules
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs "linux-modules-extra-$(uname -r)" ||
            sudo apt-get install -y xfsprogs
      - name: probe dm-log-writes, dm-snapshot and loop devices
        if: steps.scope.outputs.run == 'true'
        run: sudo scripts/power-loss/probe.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.run == 'true'
      - name: build the harness
        if: steps.scope.outputs.run == 'true'
        run: cargo build --release -p zerodb-oracle --bin power-loss -p zerodb-tools --bin zerodb-tools
      - name: run (ext4 and XFS; default, WRITE_MAP, NO_META_SYNC; with and without spills)
        if: steps.scope.outputs.run == 'true'
        env:
          SEEDS: ${{ github.event_name == 'pull_request' && '7' || '7 24 1' }}
          MAX_POINTS: ${{ github.event_name == 'pull_request' && '40' || '250' }}
        run: |
          sudo env BIN_DIR="$PWD/target/release" FS="ext4 xfs" SEEDS="$SEEDS" \
            MAX_POINTS="$MAX_POINTS" WORK="$RUNNER_TEMP/power-loss" \
            scripts/power-loss/run.sh

  nightly:
    name: nightly — long fuzz, full crash run, stress (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350 # GitHub caps a job at 6 h
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo install just --version 1.58.0 --locked
      - run: just stress
      - run: just crash-test-full
      # 3.5 h native + 26 min through the heed adapter, to fit the 6 h job
      # cap; the 24 h soak the consumer integration gate asks for needs a
      # self-hosted runner.
      - run: just fuzz-long 12600
      - name: keep any crash artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-fuzz-artifacts-${{ matrix.os }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  # The consumer gate of docs/maintainers/CONSUMER-GATE.md, run by the same
  # scripts as the manual gate. Each script clones the consumer at the pinned
  # ref, patches heed to crates/heed-zerodb (plus the `unique-txns` feature and
  # the git-source `[patch]` table for Meilisearch's heed fork), checks that C
  # LMDB has left the dependency tree, and runs the suites. It prints the
  # ZeroDB commit and the consumer ref and commit first, and the summed test
  # counts last; both also go to the job summary. A build break fails the job:
  # that is how a new consumer release that the adapter does not cover shows.
  consumers:
    name: consumer gate (${{ matrix.consumer }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        consumer: [meilisearch, hannoy]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # Pinned consumer versions. Meilisearch v1.55.1 is the latest release on
      # heed 0.22.1 (through its heed fork, hence `unique-txns`); v1.56.0 and
      # later depend on heed 0.23. hannoy v0.2.0 is the release Meilisearch
      # v1.55 depends on. Move a pin here and in the scripts' defaults
      # together.
      MEILISEARCH_REF: ${{ inputs.meilisearch_ref || 'v1.55.1' }}
      HANNOY_REF: ${{ inputs.hannoy_ref || 'v0.2.0' }}
      # Debug info would not fit the runner's disk for milli's test binaries;
      # it changes nothing the tests observe.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: free disk space for the consumer build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # Meilisearch pins its own toolchain (rust-toolchain.toml), which rustup
      # installs on first use inside the clone; scripts/hannoy.sh builds with
      # stable.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-01)
        with:
          toolchain: stable
      - name: Meilisearch milli + index-scheduler suites on ZeroDB
        if: matrix.consumer == 'meilisearch'
        run: scripts/consumer.sh suites
      - name: hannoy suite on ZeroDB
        if: matrix.consumer == 'hannoy'
        run: scripts/hannoy.sh suites
      - name: keep the test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-logs-${{ matrix.consumer }}
          path: target/consumer/logs
          if-no-files-found: ignore
