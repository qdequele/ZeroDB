# ZeroDB CI — the CLAUDE.md gate battery, automated.
#
# Per push / PR: fmt, clippy, tests (x86-64 and aarch64), miri on the core,
# loom on the reader table, the 10-minute differential fuzz and the crash
# smoke. Nightly: the long fuzz, the full crash run and the reader stress.
# The oracle crate links the real LMDB fork (lmdb-master-sys), so every job
# needs a C toolchain — the GitHub Ubuntu images ship gcc.
#
# Still missing vs PLAN.md §Testing strategy: a 64K-page kernel. GitHub's
# hosted aarch64 runners use 4K pages; a self-hosted Graviton box with a 64K
# kernel (e.g. RHEL for ARM) has to be added by hand under `runs-on`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly, 02:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: fmt + clippy + test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # heed-shim is excluded from the workspace on purpose; make sure it still builds.
      - run: cargo check --manifest-path crates/heed-shim/Cargo.toml

  msrv:
    name: MSRV (workspace rust-version)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: read rust-version
        id: msrv
        run: echo "v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo check --manifest-path crates/heed-shim/Cargo.toml

  miri:
    name: miri (zerodb-core)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - run: cargo miri test -p zerodb-core

  loom:
    name: loom (reader table)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTFLAGS="--cfg loom" CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true cargo test -p zerodb-core --lib --release loom_

  fuzz-quick:
    name: differential fuzz, 10 min (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run diff_ops -- -max_total_time=600
      - run: cargo +nightly fuzz run fuzz_page_decode -- -max_total_time=120
      - name: keep any crash artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.os }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  crash-quick:
    name: crash-consistency smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p zerodb-oracle --bin crash-harness -- --cycles 200

  nightly:
    name: nightly — long fuzz, full crash run, stress (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350 # GitHub caps a job at 6 h
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - run: cargo install cargo-fuzz --locked
      - run: ZERODB_STRESS_SECS=180 cargo test -p zerodb --test reader_stress -- --nocapture stress_
      - run: cargo run -p zerodb-oracle --bin crash-harness -- --cycles 10000
      # 4 h here; `just fuzz-long` is 6 h and the 24 h soak PLAN 1.14 asks for
      # needs a self-hosted runner.
      - run: cargo +nightly fuzz run diff_ops -- -max_total_time=14400
      - name: keep any crash artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-artifacts-${{ matrix.os }}
          path: fuzz/artifacts
          if-no-files-found: ignore
