[package]
name = "zerodb"
version = "0.2.0"
description = "A pure-Rust embedded key-value store with LMDB's design and the heed API, with no C dependency."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["lmdb", "heed", "key-value", "embedded", "database"]
categories = ["database-implementations", "database"]

[dependencies]
zerodb-core = { path = "../zerodb-core", version = "=0.2.0" }
zerodb-io = { path = "../zerodb-io", version = "=0.2.0" }
# EAGAIN for the PREV_SNAPSHOT joiner refusal and EROFS for a writable open on
# read-only media (ADR-0023 stage 3, `Env::open`);
# allowlisted (AGENTS.md).
libc.workspace = true
