[package]
name = "zerodb-core"
version = "0.1.0"
description = "ZeroDB engine core: copy-on-write B+tree pages, MVCC transactions, free-page GC and a lock-free reader table. No I/O policy."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["lmdb", "heed", "key-value", "btree", "mvcc"]
categories = ["database-implementations"]

[dependencies]
thiserror.workspace = true
# Cache-line padding for the reader-table slots (SPEC 04 TXN-14; ADR-0006 D1).
# On the AGENTS.md dependency allowlist.
crossbeam-utils.workspace = true

# loom is compiled ONLY under `RUSTFLAGS="--cfg loom"` (`just loom`) — never in
# a normal, miri, or release build. Sanctioned by ADR-0006 (test infrastructure
# only, this crate only), on the ADR-0001 libfuzzer-sys precedent.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
proptest.workspace = true
# The heap-backed writable-map stand-in (ADR-0021 M1): lets the in-place
# WRITE_MAP brokered discipline run under miri (`tests/writemap_in_place_miri.rs`).
# A dev-dependency cycle (zerodb-io depends on this crate) is fine for cargo
# and is stripped on publish (path-only).
zerodb-io = { path = "../zerodb-io", features = ["test-backing"] }

[lints.rust]
# `cfg(loom)` is set externally by the `just loom` recipe (ADR-0006).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
