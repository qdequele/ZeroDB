[package]
name = "zerodb-tools"
version = "0.2.0"
description = "Utilities for ZeroDB environments: stat, dump, load, check and migrate-from-lmdb."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../docs/TOOLS.md"
keywords = ["lmdb", "heed", "zerodb", "cli", "database"]
categories = ["command-line-utilities", "database"]

[lib]
name = "zerodb_tools"
path = "src/lib.rs"

[[bin]]
name = "zerodb-tools"
path = "src/main.rs"

[dependencies]
zerodb = { path = "../zerodb", version = "=0.2.0" }
zerodb-core = { path = "../zerodb-core", version = "=0.2.0" }
# Read-only file helpers (probe_page_size) for the offline `check` walk; no C.
zerodb-io = { path = "../zerodb-io", version = "=0.2.0" }
# The `EROFS` errno constant only (`check` on read-only media); no FFI call.
# libc is on the AGENTS.md allowlist.
libc.workspace = true
# migrate-from-lmdb only: opens a real LMDB env read-only (the Meilisearch
# fork). Off by default; see the ADR-0001 amendment (2026-07-17).
heed = { version = "=0.22.1", optional = true }

[features]
# Enables the `migrate-from-lmdb` subcommand (links C LMDB via heed).
migrate-lmdb = ["dep:heed"]

[dev-dependencies]
# The live-env tests hold an environment open in a child process through the
# heed adapter, as Meilisearch does (ADR-0023 amendment 18). Workspace-internal,
# not a new external dependency.
heed-zerodb = { path = "../heed-zerodb" }
