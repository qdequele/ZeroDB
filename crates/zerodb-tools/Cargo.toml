[package]
name = "zerodb-tools"
version = "0.2.0"
description = "Offline utilities for ZeroDB environments: stat, dump, load, check and migrate-from-lmdb."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../docs/TOOLS.md"
keywords = ["lmdb", "heed", "zerodb", "cli", "database"]
categories = ["command-line-utilities", "database"]

[lib]
name = "zerodb_tools"
path = "src/lib.rs"

[[bin]]
name = "zerodb-tools"
path = "src/main.rs"

[dependencies]
zerodb = { path = "../zerodb", version = "=0.2.0" }
zerodb-core = { path = "../zerodb-core", version = "=0.2.0" }
# Read-only file helpers (probe_page_size) for the offline `check` walk; no C.
zerodb-io = { path = "../zerodb-io", version = "=0.2.0" }
# `flock`-based advisory liveness guard on the data file (ZeroDB is
# single-process, see docs/DIVERGENCES.md: no cross-process protocol exists, so
# the guard is best-effort). libc is on the AGENTS.md allowlist; the single
# `unsafe` FFI block is confined to `src/lock.rs` with a SAFETY comment. The
# AGENTS.md unsafe policy lists this flock as in use and awaiting maintainer
# review.
libc.workspace = true
# migrate-from-lmdb only: opens a real LMDB env read-only (the Meilisearch
# fork). Off by default; see the ADR-0001 amendment (2026-07-17).
heed = { version = "=0.22.1", optional = true }

[features]
# Enables the `migrate-from-lmdb` subcommand (links C LMDB via heed).
migrate-lmdb = ["dep:heed"]
