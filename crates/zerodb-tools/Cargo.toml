[package]
name = "zerodb-tools"
version = "0.2.0"
description = "Command-line utilities for ZeroDB environments: stat, dump, load, check and migrate-from-lmdb."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../docs/TOOLS.md"
keywords = ["lmdb", "heed", "zerodb", "cli", "database"]
categories = ["command-line-utilities", "database"]

[lib]
name = "zerodb_tools"
path = "src/lib.rs"

[[bin]]
name = "zerodb-tools"
path = "src/main.rs"

[dependencies]
zerodb = { path = "../zerodb", version = "=0.2.0" }
zerodb-core = { path = "../zerodb-core", version = "=0.2.0" }
# `probe_page_size` for `check`'s raw-file fallback, and
# `lockfile::published_max_readers`, so a tool joins a running env with its
# lock file's `max_readers` (ADR-0023); no C.
zerodb-io = { path = "../zerodb-io", version = "=0.2.0" }
# migrate-from-lmdb only: opens a real LMDB env read-only (the Meilisearch
# fork). Off by default (ADR-0001).
heed = { version = "=0.22.1", optional = true }

[features]
# Enables the `migrate-from-lmdb` subcommand (links C LMDB via heed).
migrate-lmdb = ["dep:heed"]

[dev-dependencies]
# The live-env tests hold an environment open in a child process through the
# heed adapter, as Meilisearch does (ADR-0023). Workspace-internal,
# not a new external dependency.
heed-zerodb = { path = "../heed-zerodb" }
