[package]
name = "zerodb-oracle"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The oracle is the ONLY crate permitted to link C LMDB (CLAUDE.md unsafe policy).
# heed 0.22.1 vendors lmdb-master-sys 0.2.6 = the Meilisearch LMDB fork
# (mdb.master.nested-rtxns @ cd767228). Exact pin — see ADR-0001. This crate,
# and only this crate, may depend on heed / any LMDB sys crate in Phases 0–1.
heed = "=0.22.1"
# Direct FFI to the same vendored fork, for dup surfaces heed does not expose
# (GET_BOTH/GET_BOTH_RANGE, raw dbi flags, MDB_MULTIPLE). Sanctioned by
# ADR-0011 Q2 ("direct lmdb-master-sys FFI inside zerodb-oracle — the one
# crate allowed to"); exact same pin heed vendors, so a single C linkage.
lmdb-master-sys = "=0.2.6"
thiserror.workspace = true
arbitrary.workspace = true
# The native engine under test. Workspace-internal, no C linkage.
zerodb = { path = "../zerodb" }
zerodb-core = { path = "../zerodb-core" }
# The heed adapter (M1.13), driven as a third engine (`HeedZerodbEngine`) so the
# oracle re-runs the whole op model THROUGH the adapter (ADR-0003 accept #6).
# Depends on zerodb (no C) + heed-traits/heed-types (no C) — ADR-0001 compliant.
heed-zerodb = { path = "../heed-zerodb" }
# The fault-injection write backend + deterministic PRNG for the M1.11 crash
# harness (ADR-0008). Workspace-internal.
zerodb-io = { path = "../zerodb-io" }

[[bin]]
name = "crash-harness"
path = "src/bin/crash-harness.rs"

[dev-dependencies]
proptest.workspace = true
