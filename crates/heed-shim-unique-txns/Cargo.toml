# heed-shim-unique-txns — the patch target for consumers built against
# Meilisearch's heed fork (`meilisearch/heed@mutexify-open-dbi`, Meilisearch
# v1.55 and later). Like `crates/heed-shim`, it is a crate literally named
# `heed` that re-exports `heed-zerodb`, but with the `unique-txns` feature on,
# so it presents the fork's API instead of heed 0.22.1's (ADR-0027).
#
# A separate crate rather than a feature of `heed-shim`: the consumer's crates
# depend on plain `heed` and none of them asks for `unique-txns`, so the
# choice has to be made by the patch path itself. `scripts/consumer.sh` picks this crate when the consumer's lock
# file resolves heed from the fork.
#
# NOT a member of the ZeroDB workspace, for the same reason as `heed-shim`.
[workspace]

[package]
name = "heed"
version = "0.22.1"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
heed-zerodb = { path = "../heed-zerodb", features = ["unique-txns"] }

# heed's public feature names, declared as **no-op passthroughs** so a consumer's
# `heed = { features = [...] }` resolves. The adapter's serde codecs are always
# compiled in `heed-zerodb`; `posix-sem` and the LMDB build knobs are irrelevant
# to the pure-Rust engine. Mirrors heed 0.22.1's `[features]` names.
[features]
default = ["serde", "serde-bincode", "serde-json"]
serde = []
serde-bincode = []
serde-json = []
serde-rmp = []
preserve_order = []
arbitrary_precision = []
raw_value = []
unbounded_depth = []
posix-sem = []
longer-keys = []
use-valgrind = []
mdb_idl_logn_8 = []
mdb_idl_logn_9 = []
mdb_idl_logn_10 = []
mdb_idl_logn_11 = []
mdb_idl_logn_12 = []
mdb_idl_logn_13 = []
mdb_idl_logn_14 = []
mdb_idl_logn_15 = []
mdb_idl_logn_16 = []
