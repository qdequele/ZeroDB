# ZeroDB's heed adapter: heed 0.22.1's public API over the ZeroDB engine
# (ADR-0003).
#
# The package is named `heed`, at heed's version, so a consumer swaps LMDB for
# ZeroDB with one `[patch.crates-io] heed = { git = "…ZeroDB" }` line: cargo's
# `[patch]` matches the replacement by package name and ignores a `package =`
# rename. Inside this workspace the oracle and zerodb-tools depend on it as
# `heed_zerodb = { package = "heed", path = … }`, next to the real crates.io
# `heed` the oracle compares it with; in cargo commands, select it with
# `-p heed` (the workspace member wins over the registry crate).
[package]
name = "heed"
version = "0.22.1"
# Never published: the `heed` name on crates.io belongs to heed itself
# (ADR-0013). Consumers reach it through `[patch]`.
publish = false
description = "The heed 0.22.1 API over the ZeroDB engine, so heed users can switch from LMDB without code changes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The native engine under test. Workspace-internal, no C linkage.
zerodb = { path = "../zerodb" }
# The backend-independent trait + codec crates, re-exported VERBATIM so codec
# identity (`BytesEncode`/`BytesDecode`) and trait coherence hold across the two
# sibling surfaces (ADR-0003: "the codec and trait types are literally the same
# types"). Pinned to the exact 0.22.1-line versions heed 0.22.1 bundles.
heed-traits = "=0.20.0"
heed-types = { version = "=0.21.0", default-features = false, features = [
  "serde-bincode",
  "serde-json",
] }
# Re-exported as `heed::byteorder` (heed does `pub use byteorder`); milli names
# `heed::byteorder::BigEndian`. Part of the sanctioned heed-surface re-export
# (heed-types already pulls it transitively), not a new engine dependency.
byteorder = "1.5"
# Allow-listed (CONTRIBUTING.md). One `sysconf` call re-imposes the fork's
# `map_size` OS-page-multiple check at the heed boundary (heed uses `page_size`).
libc = { workspace = true }

[features]
# heed 0.22.1's feature names, so a consumer's `heed = { features = [...] }`
# still resolves once patched. They do nothing: the serde codecs are always
# compiled in, and the LMDB build knobs do not apply to ZeroDB.
default = ["serde", "serde-bincode", "serde-json"]
serde = []
serde-bincode = []
serde-json = []
serde-rmp = []
preserve_order = []
arbitrary_precision = []
raw_value = []
unbounded_depth = []
posix-sem = []
longer-keys = []
use-valgrind = []
mdb_idl_logn_8 = []
mdb_idl_logn_9 = []
mdb_idl_logn_10 = []
mdb_idl_logn_11 = []
mdb_idl_logn_12 = []
mdb_idl_logn_13 = []
mdb_idl_logn_14 = []
mdb_idl_logn_15 = []
mdb_idl_logn_16 = []
# The API of Meilisearch's heed fork (`meilisearch/heed@mutexify-open-dbi`,
# Meilisearch v1.55 and later) instead of heed 0.22.1's (ADR-0027). Not
# additive: it changes `open_database`/`create_database` signatures and removes
# `RoTxn::commit` and `Env::non_free_pages_size`, as the fork does. A `[patch]`
# cannot turn it on: a consumer on the fork enables it from one of its own
# dependencies on `heed` (docs/USING.md). Never on in this workspace's default
# build.
unique-txns = []

[dev-dependencies]
tempfile = "3"
# For the OS-page-size probe in the page-size parity test (allowlisted dep).
libc.workspace = true
# ADR-0021 (adapter borrow audit): the lifetime-erased write cursor
# is exercised under miri over the heap-backed writable-map stand-in —
# workspace-internal test infrastructure, not new external dependencies.
zerodb-core = { path = "../zerodb-core" }
zerodb-io = { path = "../zerodb-io", features = ["test-backing"] }
